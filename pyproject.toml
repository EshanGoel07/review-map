[project]
name = "review-map"
dynamic = ["version"]
description = "A reading plan for reviewing AI-generated pull requests: what to read carefully, what to skim, and what the description didn't mention."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Eshan Goel" }]
keywords = ["code-review", "pull-request", "llm", "git", "risk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "unidiff>=0.7.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "openai>=1.40",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "httpx2>=2.12,<3",
]

[project.scripts]
review-map = "review_map.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/review_map/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/review_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is clearer than a long list for word lists
