# Example Review Map config. Copy to `.reviewmap.yml` in the root of your repo.
# Every setting is optional; the values below are the defaults unless noted.

# Files to leave out of the reading plan (still listed as "ignored").
# Globs work like .gitignore: "*.snap" matches at any depth, "docs/" matches a
# whole directory, "src/legacy/*.py" is anchored at the repo root, "**" spans dirs.
ignore: []
#  - "docs/"
#  - "**/__snapshots__/"

# Extra paths that should always count as risky (added to the built-in rules).
sensitive_paths: []
#  - "src/billing/"
#  - "app/permissions.py"

# How much the plan asks you to read carefully.
reading_budget:
  lines_fraction: 0.15  # share of changed lines, between 0 and 1
  max_units: 5          # at most this many functions/sections
  min_lines: 40         # but always allow at least this many lines

# LLM used to read the PR description. REVIEW_MAP_LLM_* env vars override this.
# API keys never go here: put them in .env or in your CI secrets.
# Without an API key, Review Map falls back to a heuristic (low-confidence) parser.
llm:
  provider: null  # groq | gemini | anthropic | openai | ollama; null = the first
                  # provider whose key is set (Groq, Gemini, Anthropic, OpenAI)
  model: null     # null = the provider's default, e.g. openai/gpt-oss-120b
